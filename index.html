<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeatherScope</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
<section class="hero">
<p class="eyebrow">LIVE WEATHER</p>
<h1>WeatherScope</h1>
<p class="subtitle">Check current weather conditions for any city.</p>
<div class="search-box">
<form id="weatherForm">
<input id="cityInput" type="text" placeholder="Enter city name..." autocomplete="off" required>
<button id="searchBtn" type="submit">Check Weather</button>
</form>
</div>
<div class="popular">
<span>Popular:</span>
<button type="button" data-city="Jaipur">Jaipur</button>
<button type="button" data-city="Delhi">Delhi</button>
<button type="button" data-city="Mumbai">Mumbai</button>
<button type="button" data-city="London">London</button>
</div>
</section>

<p id="status" class="status"></p>

<section id="weatherCard" class="weather-card hidden">
<div class="weather-top">
<div>
<p class="label">CURRENT WEATHER</p>
<h2 id="location">—</h2>
<p id="condition">—</p>
</div>
<img id="weatherIcon" src="" alt="Weather icon" hidden>
</div>
<div class="temperature"><span id="temperature">—</span><sup>°C</sup></div>
<p class="feels">Feels like <strong id="feelsLike">—</strong>°C</p>
<div class="details">
<div class="detail"><span>Humidity</span><strong id="humidity">—</strong></div>
<div class="detail"><span>Wind</span><strong id="wind">—</strong></div>
<div class="detail"><span>Pressure</span><strong id="pressure">—</strong></div>
<div class="detail"><span>Visibility</span><strong id="visibility">—</strong></div>
</div>
<div class="footer-info">
<span id="coordinates">—</span>
<span id="updated">—</span>
</div>
</section>

<section id="emptyState" class="empty">
<div class="empty-icon">☁</div>
<h2>Search for a city</h2>
<p>Enter a city above to see its current weather.</p>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
